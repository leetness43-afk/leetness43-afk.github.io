<script>
// 1. Fetch external navigation header
fetch('nav.html')
    .then(res => res.text())
    .then(data => {
        document.getElementById('site-header').innerHTML = data;
    })
    .catch(err => console.error('Error loading navigation:', err));

const daysOfWeek = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];

const drugDatabase = {
    "tap-5": { name: "Methimazole", strength: 5, unit: "mg", presets: [5, 10, 15, 20, 30, 40], defaultDose: 15 },
    "tap-10": { name: "Methimazole", strength: 10, unit: "mg", presets: [5, 10, 15, 20, 30, 40], defaultDose: 15 },
    "tap-20": { name: "Methimazole", strength: 20, unit: "mg", presets: [5, 10, 15, 20, 30, 40], defaultDose: 20 },
    "ptu-50": { name: "Propylthiouracil (PTU)", strength: 50, unit: "mg", presets: [100, 150, 200, 300, 450, 600], defaultDose: 300 }
};

function initDays() {
    const container = document.getElementById('daysContainer');
    container.innerHTML = '';
    
    daysOfWeek.forEach((day, index) => {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'bg-slate-900/90 p-2 rounded-lg border border-emerald-800/80 text-center flex flex-col gap-1.5';
        
        dayDiv.innerHTML = `
            <label for="day-${index}" class="block text-xs font-bold text-emerald-400">${day}</label>
            <select id="day-${index}" aria-label="Tablet quantity for ${day}" class="day-select w-full p-1.5 border border-emerald-700 rounded text-sm bg-slate-950 text-emerald-100 focus:ring-emerald-500 focus:border-emerald-500" onchange="calculateDose()">
                <option value="0">Skip (0)</option>
                <option value="0.5">1/2 Pill</option>
                <option value="1">1 Pill</option>
                <option value="1.5">1.5 Pills</option>
                <option value="2">2 Pills</option>
                <option value="2.5">2.5 Pills</option>
                <option value="3">3 Pills</option>
                <option value="3.5">3.5 Pills</option>
                <option value="4">4 Pills</option>
                <option value="5">5 Pills</option>
                <option value="6">6 Pills</option>
            </select>
        `;
        container.appendChild(dayDiv);
    });
}

function updatePresetButtons() {
    const drugKey = document.getElementById('drugSelect').value;
    const meta = drugDatabase[drugKey];
    const presetContainer = document.getElementById('presetButtons');
    
    presetContainer.innerHTML = meta.presets.map(mg => 
        `<button type="button" onclick="setPresetDose(${mg})" class="px-3 py-1 bg-slate-800 hover:bg-emerald-700 text-emerald-200 rounded border border-emerald-700/60 text-sm font-medium transition">${mg} mg</button>`
    ).join('');
}

function handleDrugChange() {
    const drugKey = document.getElementById('drugSelect').value;
    const meta = drugDatabase[drugKey];
    
    document.getElementById('targetDailyDose').value = meta.defaultDose;
    
    updatePresetButtons();
    applyTargetDose();
}

function setPresetDose(mg) {
    document.getElementById('targetDailyDose').value = mg;
    applyTargetDose();
}

function applyTargetDose() {
    const drugKey = document.getElementById('drugSelect').value;
    const strength = drugDatabase[drugKey].strength;
    const targetMg = parseFloat(document.getElementById('targetDailyDose').value) || 0;
    
    let pillCount = targetMg / strength;
    pillCount = Math.round(pillCount * 2) / 2;

    daysOfWeek.forEach((_, index) => {
        const select = document.getElementById(`day-${index}`);
        if (select) {
            select.value = pillCount.toString();
        }
    });

    calculateDose();
}

function applyAlternatingPattern(pillsDayA, pillsDayB) {
    daysOfWeek.forEach((_, index) => {
        const select = document.getElementById(`day-${index}`);
        if (select) {
            select.value = (index % 2 === 0 ? pillsDayA : pillsDayB).toString();
        }
    });
    calculateDose();
}

function applyWeekdayWeekendPattern(weekdayPills, weekendPills) {
    daysOfWeek.forEach((_, index) => {
        const select = document.getElementById(`day-${index}`);
        if (select) {
            select.value = (index < 5 ? weekdayPills : weekendPills).toString();
        }
    });
    calculateDose();
}

function toggleCustomDays() {
    const select = document.getElementById('daysSupplySelect');
    const customWrapper = document.getElementById('customDaysWrapper');
    if (select.value === 'custom') {
        customWrapper.classList.remove('hidden');
    } else {
        customWrapper.classList.add('hidden');
    }
    calculateDose();
}

function getDaysSupply() {
    const select = document.getElementById('daysSupplySelect');
    if (select.value === 'custom') {
        return Math.max(1, parseInt(document.getElementById('customDaysInput').value, 10) || 0);
    }
    return parseInt(select.value, 10);
}

function calculateDose() {
    const selectedKey = document.getElementById('drugSelect').value;
    const daysSupply = getDaysSupply();
    const meta = drugDatabase[selectedKey];
    
    let totalWeeklyDose = 0;
    let totalWeeklyPills = 0;
    const dayData = [];

    daysOfWeek.forEach((_, index) => {
        const multiplier = parseFloat(document.getElementById(`day-${index}`).value) || 0;
        const dayDose = multiplier * meta.strength;
        
        dayData.push({
            multiplier,
            drugKey: selectedKey,
            drugName: meta.name,
            strength: meta.strength,
            unit: meta.unit,
            dose: dayDose
        });
        
        totalWeeklyDose += dayDose;
        totalWeeklyPills += multiplier;
    });

    const avgDailyDose = (totalWeeklyDose / 7).toFixed(1);

    document.getElementById('calcHeader').textContent = `${meta.name} ${meta.strength} ${meta.unit} tablet schedule (${daysSupply}-Day Supply Calculation)`;
    document.getElementById('averageDoseOutput').textContent = `${avgDailyDose} ${meta.unit} / day`;
    document.getElementById('weeklyTotalOutput').textContent = `Total Weekly Dose: ${totalWeeklyDose.toFixed(1)} ${meta.unit}`;

    const weeksInSupply = daysSupply / 7;
    document.getElementById('dispenseTitle').textContent = `Dispense Quantity (${daysSupply} Days)`;

    if (totalWeeklyPills === 0) {
        document.getElementById('dispenseOutput').textContent = '0 Tablets';
        document.getElementById('dispenseSubtext').textContent = 'No active pills scheduled';
    } else {
        const exactPillsNeeded = totalWeeklyPills * weeksInSupply;
        const roundedPills = Math.ceil(exactPillsNeeded);
        document.getElementById('dispenseOutput').textContent = `${roundedPills} Tabs (${meta.name} ${meta.strength} ${meta.unit})`;
        document.getElementById('dispenseSubtext').textContent = `Exact requirement: ${exactPillsNeeded.toFixed(1)} tabs over ${daysSupply} days`;
    }

    renderTable(dayData);
    renderInstructions(dayData, meta);
}

function renderTable(dayData) {
    const html = `<table class="min-w-full border-collapse border border-emerald-800 text-sm">
        <thead class="bg-emerald-900 text-emerald-200">
            <tr>
                ${daysOfWeek.map(d => `<th class="border border-emerald-800 p-2 text-center">${d}</th>`).join('')}
            </tr>
        </thead>
        <tbody>
            <tr class="bg-slate-900">
                ${dayData.map(d => {
                    let label = `${d.multiplier} pill${d.multiplier === 1 ? '' : 's'}`;
                    if (d.multiplier === 0.5) label = "1/2 pill";
                    if (d.multiplier === 0) label = "Skip";
                    return `<td class="border border-emerald-800 p-2 text-center font-bold text-emerald-100">${label}</td>`;
                }).join('')}
            </tr>
            <tr class="bg-emerald-950/40">
                ${dayData.map(d => `<td class="border border-emerald-800 p-2 text-center text-xs text-emerald-200/70">${d.dose.toFixed(1)}${d.unit}</td>`).join('')}
            </tr>
        </tbody>
    </table>`;
    
    document.getElementById('scheduleTableContainer').innerHTML = html;
}

function renderInstructions(dayData, meta) {
    const groups = {};

    dayData.forEach((d, idx) => {
        if (!groups[d.multiplier]) groups[d.multiplier] = [];
        groups[d.multiplier].push(daysOfWeek[idx]);
    });

    if (groups[1] && groups[1].length === 7) {
        document.getElementById('patientInstructions').textContent = `Take ${meta.name} ${meta.strength} ${meta.unit} (1 tablet) every day.`;
        return;
    }

    const keys = Object.keys(groups).map(Number).sort((a, b) => b - a);
    const descriptions = [];

    keys.forEach(mult => {
        const days = groups[mult];
        if (mult === 0) {
            descriptions.push(`skip dose on ${days.join(', ')}`);
        } else if (mult === 0.5) {
            descriptions.push(`half a tablet (${meta.strength / 2} ${meta.unit}) on ${days.join(', ')}`);
        } else if (mult === 1) {
            descriptions.push(`1 tablet (${meta.strength} ${meta.unit}) on ${days.join(', ')}`);
        } else {
            descriptions.push(`${mult} tablets (${meta.strength * mult} ${meta.unit}) on ${days.join(', ')}`);
        }
    });

    document.getElementById('patientInstructions').textContent = 
        `Take ${meta.name} ${meta.strength} ${meta.unit}: ` + descriptions.join('; ') + '.';
}

function copyPatientSig() {
    const textToCopy = document.getElementById('patientInstructions').textContent.trim();
    if (!textToCopy || textToCopy === '--') return;

    navigator.clipboard.writeText(textToCopy).then(() => {
        const btn = document.getElementById('copySigBtn');
        const originalText = btn.innerHTML;
        btn.innerHTML = '✅ Copied!';
        btn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
        btn.classList.add('bg-green-500', 'hover:bg-green-400');

        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove('bg-green-500', 'hover:bg-green-400');
            btn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
        }, 2000);
    });
}

window.addEventListener('DOMContentLoaded', () => {
    initDays();
    updatePresetButtons();
    applyTargetDose();
});
</script>
